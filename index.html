<!doctype html>
<html lang="ar" dir="rtl" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Archai HR — نظام إدارة الموارد البشرية" />
    <title>Archai HR</title>
    <script>
      /* مزامنة مبكرة للغة والاتجاه قبل تحميل React — يمنع وميض الاتجاه
         لو الزيارة السابقة كانت بلغة مختلفة عن الافتراضي (ar/rtl). */
      try {
        var lng = localStorage.getItem("i18nextLng")
        var isEn = lng && lng.indexOf("en") === 0
        document.documentElement.lang = isEn ? "en" : "ar"
        document.documentElement.dir = isEn ? "ltr" : "rtl"
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
